<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Co-Op Schedule Matcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Header Controls -->
    <header class="flex flex-col md:flex-row items-center justify-between gap-4 bg-slate-900/80 p-6 rounded-xl border border-slate-800 shadow-xl">
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent flex items-center gap-2">
          <span>🎮</span> Co-Op Schedule Matcher
        </h1>
        <p class="text-xs text-slate-400 mt-1">Real-time weekly availability & busy state sync via Supabase</p>
      </div>

      <div class="flex items-center gap-4 flex-wrap">
        <div class="flex items-center gap-2 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 text-xs">
          <label for="week-select" class="text-slate-400 font-semibold uppercase">Week:</label>
          <input type="week" id="week-select" class="bg-transparent text-slate-200 outline-none cursor-pointer">
        </div>

        <div class="flex items-center gap-2 bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
          <span class="text-slate-400 px-2 font-semibold uppercase">As:</span>
          <button id="btn-francis" onclick="setUser('Francis')" class="px-3 py-1 rounded-md transition-all font-medium text-slate-400">Francis</button>
          <button id="btn-lyuji" onclick="setUser('Lyuji')" class="px-3 py-1 rounded-md transition-all font-medium text-slate-400">Lyuji</button>
        </div>

        <button onclick="clearWeek()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">
          Clear Week
        </button>
      </div>
    </header>

    <!-- Legend -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
      <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-lg flex items-center gap-3">
        <div class="w-4 h-4 rounded bg-cyan-500/30 border border-cyan-400 flex-shrink-0"></div>
        <div>
          <div class="font-semibold text-cyan-300">Francis Free</div>
          <div class="text-[10px] text-slate-400">Available</div>
        </div>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-lg flex items-center gap-3">
        <div class="w-4 h-4 rounded bg-purple-500/30 border border-purple-400 flex-shrink-0"></div>
        <div>
          <div class="font-semibold text-purple-300">Lyuji Free</div>
          <div class="text-[10px] text-slate-400">Available</div>
        </div>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-lg flex items-center gap-3">
        <div class="w-4 h-4 rounded bg-red-500/30 border border-red-400/50 flex-shrink-0"></div>
        <div>
          <div class="font-semibold text-red-300">Busy / Sleep</div>
          <div class="text-[10px] text-slate-400">Unavailable</div>
        </div>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-lg flex items-center gap-3">
        <div class="w-4 h-4 rounded bg-emerald-500/40 border border-emerald-400 flex-shrink-0"></div>
        <div>
          <div class="font-semibold text-emerald-300">⚔️ MATCH! Both Free</div>
          <div class="text-[10px] text-slate-400">Co-Op Gaming Time</div>
        </div>
      </div>
    </div>

    <!-- Instruction Tip (Unicode Arrows Fixed) -->
    <div class="text-xs text-slate-400 text-center bg-slate-900/40 py-2 rounded-lg border border-slate-800">
      💡 <span class="font-semibold text-slate-300">Click a slot to cycle:</span> 
      <span class="text-slate-500">Off</span> → 
      <span class="text-emerald-400 font-semibold">Free</span> → 
      <span class="text-red-400 font-semibold">Busy/Sleep</span> → 
      <span class="text-slate-500">Off</span>
    </div>

    <!-- Schedule Grid Table -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-xl overflow-x-auto shadow-2xl">
      <table class="w-full text-left border-collapse min-w-[700px]">
        <thead>
          <tr class="border-b border-slate-800 text-slate-400 text-xs">
            <th class="p-3 w-24 text-center font-semibold">Time</th>
            <th class="p-3 text-center font-semibold">Mon</th>
            <th class="p-3 text-center font-semibold">Tue</th>
            <th class="p-3 text-center font-semibold">Wed</th>
            <th class="p-3 text-center font-semibold">Thu</th>
            <th class="p-3 text-center font-semibold">Fri</th>
            <th class="p-3 text-center font-semibold">Sat</th>
            <th class="p-3 text-center font-semibold">Sun</th>
          </tr>
        </thead>
        <tbody id="grid-body" class="divide-y divide-slate-800/50 text-xs">
          <!-- Dynamically generated by JS -->
        </tbody>
      </table>
    </div>

  </div>

  <script>
    // ------------------------------------------------------------------
    // Supabase Configuration
    // ------------------------------------------------------------------
    const SUPABASE_URL = 'https://ifbutbzhnazccsrdvsjh.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // Replace with your actual anon key if needed
    
    let supabaseClient = null;
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // ------------------------------------------------------------------
    // App State
    // ------------------------------------------------------------------
    let currentUser = 'Lyuji';
    let currentWeek = '';
    let scheduleData = {}; // Format: { "2026-W40_Mon_14": { francis: 'free', lyuji: 'busy' } }

    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    // ------------------------------------------------------------------
    // Helpers & Time Formatter (12-Hour AM/PM Fixed)
    // ------------------------------------------------------------------
    function formatTimeSlot(hour) {
      const ampm = hour >= 12 ? 'PM' : 'AM';
      let formattedHour = hour % 12;
      if (formattedHour === 0) formattedHour = 12;
      return `${formattedHour}:00 ${ampm}`;
    }

    function getCurrentWeekString() {
      const date = new Date();
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
      const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
      return `${d.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    }

    function normalizeState(val) {
      if (val === true || val === 'free') return 'free';
      if (val === 'busy' || val === 'sleep') return 'busy';
      return 'none';
    }

    // ------------------------------------------------------------------
    // Initialization
    // ------------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      currentWeek = getCurrentWeekString();
      const weekPicker = document.getElementById('week-select');
      weekPicker.value = currentWeek;
      
      weekPicker.addEventListener('change', (e) => {
        currentWeek = e.target.value;
        loadSchedule();
      });

      setUser(currentUser);
      buildEmptyGrid();
      loadSchedule();
      subscribeToChanges();
    });

    function setUser(user) {
      currentUser = user;
      const btnFrancis = document.getElementById('btn-francis');
      const btnLyuji = document.getElementById('btn-lyuji');

      if (user === 'Francis') {
        btnFrancis.className = "px-3 py-1 rounded-md transition-all font-semibold bg-cyan-500/20 text-cyan-300 border border-cyan-500/40";
        btnLyuji.className = "px-3 py-1 rounded-md transition-all font-medium text-slate-400 hover:text-slate-200";
      } else {
        btnLyuji.className = "px-3 py-1 rounded-md transition-all font-semibold bg-purple-500/20 text-purple-300 border border-purple-500/40";
        btnFrancis.className = "px-3 py-1 rounded-md transition-all font-medium text-slate-400 hover:text-slate-200";
      }
    }

    // ------------------------------------------------------------------
    // UI Rendering
    // ------------------------------------------------------------------
    function buildEmptyGrid() {
      const tbody = document.getElementById('grid-body');
      tbody.innerHTML = '';

      for (let hour = 0; hour < 24; hour++) {
        const tr = document.createElement('tr');

        // Time Column Header
        const tdTime = document.createElement('td');
        tdTime.className = "p-2.5 text-center font-mono text-slate-400 text-[11px] bg-slate-900/50 border-r border-slate-800/80";
        tdTime.innerText = formatTimeSlot(hour);
        tr.appendChild(tdTime);

        // Days Columns
        days.forEach(day => {
          const slotKey = `${currentWeek}_${day}_${hour}`;
          const tdSlot = document.createElement('td');
          tdSlot.className = "p-1 text-center";
          
          const btn = document.createElement('button');
          btn.id = `slot-${slotKey}`;
          btn.onclick = () => toggleSlot(slotKey);
          btn.className = "w-full h-8 rounded border transition-all text-[11px] font-medium flex items-center justify-center bg-slate-950/40 border-slate-800/60 text-slate-600 hover:border-slate-700";
          btn.innerText = "-";

          tdSlot.appendChild(btn);
          tr.appendChild(tdSlot);
        });

        tbody.appendChild(tr);
      }
    }

    function renderGrid() {
      for (let hour = 0; hour < 24; hour++) {
        days.forEach(day => {
          const slotKey = `${currentWeek}_${day}_${hour}`;
          const btn = document.getElementById(`slot-${slotKey}`);
          if (!btn) return;

          const slotData = scheduleData[slotKey] || { francis: 'none', lyuji: 'none' };
          const francisState = normalizeState(slotData.francis);
          const lyujiState = normalizeState(slotData.lyuji);

          // BOTH FREE -> MATCH
          if (francisState === 'free' && lyujiState === 'free') {
            btn.className = "w-full h-8 rounded border transition-all text-[11px] font-bold bg-emerald-500/20 border-emerald-400/80 text-emerald-300 shadow-[0_0_10px_rgba(16,185,129,0.15)]";
            btn.innerText = "⚔️ MATCH";
          }
          // FRANCIS FREE ONLY
          else if (francisState === 'free' && lyujiState !== 'free') {
            if (lyujiState === 'busy') {
              btn.className = "w-full h-8 rounded border transition-all text-[11px] font-medium bg-gradient-to-r from-cyan-500/20 to-red-500/20 border-slate-700 text-slate-300";
              btn.innerText = "Francis";
            } else {
              btn.className = "w-full h-8 rounded border transition-all text-[11px] font-medium bg-cyan-500/20 border-cyan-400/60 text-cyan-300";
              btn.innerText = "Francis";
            }
          }
          // LYUJI FREE ONLY
          else if (lyujiState === 'free' && francisState !== 'free') {
            if (francisState === 'busy') {
              btn.className = "w-full h-8 rounded border transition-all text-[11px] font-medium bg-gradient-to-r from-red-500/20 to-purple-500/20 border-slate-700 text-slate-300";
              btn.innerText = "Lyuji";
            } else {
              btn.className = "w-full h-8 rounded border transition-all text-[11px] font-medium bg-purple-500/20 border-purple-400/60 text-purple-300";
              btn.innerText = "Lyuji";
            }
          }
          // EITHER OR BOTH BUSY
          else if (francisState === 'busy' || lyujiState === 'busy') {
            btn.className = "w-full h-8 rounded border transition-all text-[11px] font-medium bg-red-500/15 border-red-500/30 text-red-400/80";
            btn.innerText = "Busy";
          }
          // NONE / OFF
          else {
            btn.className = "w-full h-8 rounded border transition-all text-[11px] font-medium bg-slate-950/40 border-slate-800/60 text-slate-600 hover:border-slate-700";
            btn.innerText = "-";
          }
        });
      }
    }

    // ------------------------------------------------------------------
    // Actions & Supabase Operations
    // ------------------------------------------------------------------
    async function toggleSlot(slotKey) {
      const current = scheduleData[slotKey] || { francis: 'none', lyuji: 'none' };
      const userKey = currentUser.toLowerCase();
      
      const stateCycle = ['none', 'free', 'busy'];
      const currentState = normalizeState(current[userKey]);
      const nextIdx = (stateCycle.indexOf(currentState) + 1) % stateCycle.length;
      const nextState = stateCycle[nextIdx];

      scheduleData[slotKey] = {
        ...current,
        [userKey]: nextState
      };

      renderGrid();

      if (supabaseClient) {
        const payload = {
          id: slotKey,
          francis: scheduleData[slotKey].francis,
          lyuji: scheduleData[slotKey].lyuji
        };

        const { error } = await supabaseClient
          .from('schedule')
          .upsert(payload, { onConflict: 'id' });

        if (error) {
          console.error("Error saving slot to Supabase:", error);
        }
      }
    }

    async function loadSchedule() {
      buildEmptyGrid();
      scheduleData = {};

      if (!supabaseClient) return;

      try {
        const { data, error } = await supabaseClient
          .from('schedule')
          .select('*')
          .like('id', `${currentWeek}_%`);

        if (error) return console.error('Fetch error:', error);

        if (data) {
          data.forEach(row => {
            scheduleData[row.id] = {
              francis: normalizeState(row.francis),
              lyuji: normalizeState(row.lyuji)
            };
          });
          renderGrid();
        }
      } catch (e) {
        console.error("Supabase load error:", e);
      }
    }

    function subscribeToChanges() {
      if (!supabaseClient) return;

      supabaseClient
        .channel('public:schedule')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'schedule' }, payload => {
          if (payload.new && payload.new.id && payload.new.id.startsWith(currentWeek)) {
            scheduleData[payload.new.id] = {
              francis: normalizeState(payload.new.francis),
              lyuji: normalizeState(payload.new.lyuji)
            };
            renderGrid();
          }
        })
        .subscribe();
    }

    async function clearWeek() {
      if (!confirm(`Are you sure you want to clear all slots for ${currentWeek}?`)) return;

      Object.keys(scheduleData).forEach(key => {
        if (key.startsWith(currentWeek)) {
          delete scheduleData[key];
        }
      });

      renderGrid();

      if (supabaseClient) {
        const { error } = await supabaseClient
          .from('schedule')
          .delete()
          .like('id', `${currentWeek}_%`);

        if (error) console.error("Error clearing week:", error);
      }
    }
  </script>
</body>
</html>
