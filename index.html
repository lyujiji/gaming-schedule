<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Co-Op Schedule Matcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none; /* Prevents text highlight while dragging */
    }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Header Controls -->
    <header class="flex flex-col md:flex-row items-center justify-between gap-4 bg-slate-900/80 p-6 rounded-xl border border-slate-800 shadow-xl">
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent flex items-center gap-2">
          <span>🎮</span> Co-Op Schedule Matcher
        </h1>
        
        <!-- Dynamic Week Navigation Bar -->
        <div class="flex items-center gap-2 mt-2 flex-wrap">
          <button onclick="changeWeekOffset(-1)" title="Previous Week" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded text-xs transition-all border border-slate-700">
            ◄
          </button>
          
          <label for="week-select" class="cursor-pointer bg-slate-950/80 hover:bg-slate-950 px-3 py-1 rounded-md border border-slate-800 text-xs font-semibold text-indigo-300 transition-all flex items-center gap-2">
            <span id="week-range-label">Loading dates...</span>
            <span class="text-[10px] text-slate-500">✏️</span>
          </label>

          <button onclick="changeWeekOffset(1)" title="Next Week" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded text-xs transition-all border border-slate-700">
            ►
          </button>

          <button onclick="goToCurrentWeek()" title="Reset to Current Week" class="bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded text-xs font-medium transition-all ml-1">
            This Week
          </button>

          <!-- Hidden Native Input Triggered by Clicking Label -->
          <input type="week" id="week-select" class="sr-only">
        </div>
      </div>

      <div class="flex items-center gap-3 flex-wrap">
        <!-- Undo / Redo Buttons -->
        <div id="undo-redo-container" class="flex items-center gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800">
          <button id="btn-undo" onclick="undo()" title="Undo (Ctrl+Z)" disabled class="px-2.5 py-1 rounded text-xs font-medium transition-all text-slate-500 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-800 hover:text-slate-200">
            ↩️ Undo
          </button>
          <button id="btn-redo" onclick="redo()" title="Redo (Ctrl+Y)" disabled class="px-2.5 py-1 rounded text-xs font-medium transition-all text-slate-500 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-800 hover:text-slate-200">
            ↪️ Redo
          </button>
        </div>

        <!-- User Selector -->
        <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
          <span class="text-slate-400 px-2 font-semibold uppercase">View:</span>
          <button id="btn-francis" onclick="setUser('Francis')" class="px-3 py-1 rounded-md transition-all font-medium text-slate-400">Francis</button>
          <button id="btn-lyuji" onclick="setUser('Lyuji')" class="px-3 py-1 rounded-md transition-all font-medium text-slate-400">Lyuji</button>
          <button id="btn-summary" onclick="setUser('Summary')" class="px-3 py-1 rounded-md transition-all font-medium text-slate-400">📊 Summary</button>
        </div>

        <button onclick="clearWeek()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">
          Reset Selected Week
        </button>
      </div>
    </header>

    <!-- Legend -->
    <div id="legend-container" class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
      <!-- Dynamically filled depending on user mode -->
    </div>

    <!-- Dynamic Context Tip -->
    <div id="mode-tip" class="text-xs text-slate-400 text-center bg-slate-900/40 py-2 rounded-lg border border-slate-800">
      <!-- Filled via JS -->
    </div>

    <!-- Schedule Grid Table -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-xl overflow-x-auto shadow-2xl">
      <table class="w-full text-left border-collapse min-w-[700px]">
        <thead>
          <tr class="border-b border-slate-800 text-slate-400 text-xs">
            <th class="p-3 w-24 text-center font-semibold">Time</th>
            <th class="p-3 text-center font-semibold">Mon</th>
            <th class="p-3 text-center font-semibold">Tue</th>
            <th class="p-3 text-center font-semibold">Wed</th>
            <th class="p-3 text-center font-semibold">Thu</th>
            <th class="p-3 text-center font-semibold">Fri</th>
            <th class="p-3 text-center font-semibold">Sat</th>
            <th class="p-3 text-center font-semibold">Sun</th>
          </tr>
        </thead>
        <tbody id="grid-body" class="divide-y divide-slate-800/50 text-xs">
          <!-- Dynamically generated by JS -->
        </tbody>
      </table>
    </div>

  </div>

  <script>

    const scheduleByWeek = {};

    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    window.addEventListener('mouseup', handleMouseUp);
    window.addEventListener('keydown', handleKeyDown);

    function getCurrentWeekData() {
      if (!scheduleByWeek[currentWeek]) {
        scheduleByWeek[currentWeek] = {};
      }
      return scheduleByWeek[currentWeek];
    }

    function getWeekUndoStack() {
      if (!undoStacksByWeek[currentWeek]) {
        undoStacksByWeek[currentWeek] = [];
      }
      return undoStacksByWeek[currentWeek];
    }

    function getWeekRedoStack() {
      if (!redoStacksByWeek[currentWeek]) {
        redoStacksByWeek[currentWeek] = [];
      }
      return redoStacksByWeek[currentWeek];
    }

    // ------------------------------------------------------------------
    // Date & Range Formatter
    // ------------------------------------------------------------------
    function formatTimeSlot(hour) {
      const ampm = hour >= 12 ? 'PM' : 'AM';
      let formattedHour = hour % 12;
      if (formattedHour === 0) formattedHour = 12;
      return `${formattedHour}:00 ${ampm}`;
    }

    function getWeekStringFromDate(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
      const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
      return `${d.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    }

    function getMondayOfWeek(weekStr) {
      const [year, week] = weekStr.split('-W').map(Number);
      const simpleDate = new Date(year, 0, 1 + (week - 1) * 7);
      const dayOfWeek = simpleDate.getDay();
      const monday = new Date(simpleDate);
      if (dayOfWeek <= 4) {
        monday.setDate(simpleDate.getDate() - simpleDate.getDay() + 1);
      } else {
        monday.setDate(simpleDate.getDate() + 8 - simpleDate.getDay());
      }
      return monday;
    }

    function updateWeekRangeDisplay(weekStr) {
      if (!weekStr) return;
      const monday = getMondayOfWeek(weekStr);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);

      const options = { month: 'short', day: 'numeric' };
      const startText = monday.toLocaleDateString('en-US', options);
      const endText = sunday.toLocaleDateString('en-US', { ...options, year: 'numeric' });

      document.getElementById('week-range-label').innerText = `📅 ${startText} – ${endText}`;
    }

    function changeWeekOffset(offset) {
      const monday = getMondayOfWeek(currentWeek);
      monday.setDate(monday.getDate() + (offset * 7));
      switchWeek(getWeekStringFromDate(monday));
    }

    function goToCurrentWeek() {
      switchWeek(getWeekStringFromDate(new Date()));
    }

    function switchWeek(newWeekStr) {
      currentWeek = newWeekStr;
      const weekPicker = document.getElementById('week-select');
      weekPicker.value = currentWeek;

      updateWeekRangeDisplay(currentWeek);
      buildEmptyGrid();
      loadScheduleForCurrentWeek();
    }

    function normalizeState(val) {
      if (val === undefined || val === null || val === 'free' || val === true || val === 'none') return 'free';
      if (val === 'busy') return 'busy';
      if (val === 'negotiable' || val === 'sleep') return 'negotiable';
      return 'free';
    }

    // ------------------------------------------------------------------
    // Initialization
    // ------------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      const weekPicker = document.getElementById('week-select');
      weekPicker.addEventListener('change', (e) => {
        if (e.target.value) {
          switchWeek(e.target.value);
        }
      });

      setUser(currentUser);
      goToCurrentWeek();
      subscribeToChanges();
    });

    function setUser(user) {

      const btnFrancis = document.getElementById('btn-francis');

      btnSummary.className = inactiveBtn;

      if (user === 'Francis') {

        legendContainer.innerHTML = `

            </div>
          </div>
          <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-lg flex items-center gap-3">

              <div class="text-[10px] text-slate-400">Flexible availability</div>
            </div>
          </div>
          <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-lg flex items-center gap-3">
            <div class="w-4 h-4 rounded bg-red-500/30 border border-red-400 flex-shrink-0"></div>
            <div>
              <div class="font-semibold text-red-300">🚫 Busy</div>
              <div class="text-[10px] text-slate-400">Strictly unavailable</div>
            </div>
          </div>
        `;

        modeTip.innerHTML = `🔒 <span class="font-semibold text-cyan-300">Francis Input Mode:</span> <span>Click or drag to cycle your status. Lyuji's schedule is hidden to keep inputs blind.</span>`;

      } else if (user === 'Lyuji') {
        btnLyuji.className = "px-3 py-1 rounded-md transition-all font-semibold bg-purple-500/20 text-purple-300 border border-purple-500/40";
        undoRedoContainer.classList.remove('hidden');

        legendContainer.innerHTML = `
          <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-lg flex items-center gap-3">
            <div class="w-4 h-4 rounded bg-emerald-500/30 border border-emerald-400 flex-shrink-0"></div>
            <div>
              <div class="font-semibold text-emerald-300">⚔️ Available</div>
              <div class="text-[10px] text-slate-400">Default free state</div>
            </div>
          </div>
          <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-lg flex items-center gap-3">
            <div class="w-4 h-4 rounded bg-amber-500/30 border border-amber-400 flex-shrink-0"></div>
            <div>
              <div class="font-semibold text-amber-300">🌙 Flex / Negotiable</div>
              <div class="text-[10px] text-slate-400">Flexible availability</div>
            </div>
          </div>
          <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-lg flex items-center gap-3">
            <div class="w-4 h-4 rounded bg-red-500/30 border border-red-400 flex-shrink-0"></div>
            <div>
              <div class="font-semibold text-red-300">🚫 Busy</div>
              <div class="text-[10px] text-slate-400">Strictly unavailable</div>
            </div>
          </div>
        `;

        modeTip.innerHTML = `🔒 <span class="font-semibold text-purple-300">Lyuji Input Mode:</span> <span>Click or drag to cycle your status. Francis's schedule is hidden to keep inputs blind.</span>`;

      } else { // Summary Mode
        btnSummary.className = "px-3 py-1 rounded-md transition-all font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-500/40";
        undoRedoContainer.classList.add('hidden');

        legendContainer.innerHTML = `
          <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-lg flex items-center gap-3">
            <div class="w-4 h-4 rounded bg-emerald-500/30 border border-emerald-400 flex-shrink-0"></div>
            <div>
              <div class="font-semibold text-emerald-300">⚔️ MATCH!</div>
              <div class="text-[10px] text-slate-400">Both Available</div>
            </div>
          </div>
          <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-lg flex items-center gap-3">
            <div class="w-4 h-4 rounded bg-amber-500/30 border border-amber-400 flex-shrink-0"></div>

              <div class="font-semibold text-amber-300">🌙 Flex</div>
              <div class="text-[10px] text-slate-400">Flex status for one or both</div>
            </div>
          </div>
          <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-lg flex items-center gap-3">
            <div class="w-4 h-4 rounded bg-red-500/30 border border-red-400/50 flex-shrink-0"></div>
            <div>
              <div class="font-semibold text-red-300">🚫 Busy</div>
              <div class="text-[10px] text-slate-400">Both Strictly Unavailable</div>
            </div>
          </div>
          <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-lg flex items-center gap-3">
            <div class="w-4 h-4 rounded bg-cyan-500/30 border border-cyan-400 flex-shrink-0"></div>
            <div>
              <div class="font-semibold text-cyan-300">Francis / Lyuji Only</div>

          </div>
        `;

        modeTip.innerHTML = `📊 <span class="font-semibold text-indigo-300">Summary View (Read-Only):</span> <span>Combined schedule overlaying inputs from both Francis and Lyuji.</span>`;

    // ------------------------------------------------------------------
    // UI Rendering & State Precedence Logic
    // ------------------------------------------------------------------
    function buildEmptyGrid() {
      const tbody = document.getElementById('grid-body');
      tbody.innerHTML = '';

      for (let hour = 0; hour < 24; hour++) {
        const tr = document.createElement('tr');

        // Time Column
        const tdTime = document.createElement('td');
        tdTime.className = "p-2.5 text-center font-mono text-slate-400 text-[11px] bg-slate-900/50 border-r border-slate-800/80 select-none";
        tdTime.innerText = formatTimeSlot(hour);
        tr.appendChild(tdTime);

        // Days Columns
        days.forEach(day => {
          const slotKey = `${currentWeek}_${day}_${hour}`;
          const tdSlot = document.createElement('td');
          tdSlot.className = "p-1 text-center";
          
          const btn = document.createElement('button');
          btn.id = `slot-${slotKey}`;
          
          btn.onmousedown = (e) => handleMouseDown(e, slotKey);
          btn.onmouseenter = () => handleMouseEnter(slotKey);
          
          tdSlot.appendChild(btn);
          tr.appendChild(tdSlot);
        });

        tbody.appendChild(tr);
      }
      renderGrid();
    }

    function renderGrid() {
      const weekData = getCurrentWeekData();

      for (let hour = 0; hour < 24; hour++) {
        days.forEach(day => {
          const slotKey = `${currentWeek}_${day}_${hour}`;
          const btn = document.getElementById(`slot-${slotKey}`);
          if (!btn) return;

          const slotData = weekData[slotKey] || { francis: 'free', lyuji: 'free' };
          const francisState = normalizeState(slotData.francis);
          const lyujiState = normalizeState(slotData.lyuji);

          // ---------------------------------------------------------------
          // PRIVATE VIEW: INDIVIDUAL INPUT MODE (FRANCIS or LYUJI)
          // ---------------------------------------------------------------
          if (currentUser === 'Francis' || currentUser === 'Lyuji') {
            const myState = currentUser === 'Francis' ? francisState : lyujiState;
            btn.style.cursor = 'pointer';

            if (myState === 'busy') {
              btn.className = "w-full h-8 rounded border transition-all text-[11px] font-medium bg-red-500/20 border-red-500/40 text-red-300 select-none";
              btn.innerText = "🚫 Busy";
            } else if (myState === 'negotiable') {
              btn.className = "w-full h-8 rounded border transition-all text-[11px] font-medium bg-amber-500/20 border-amber-400/60 text-amber-300 select-none";
              btn.innerText = "🌙 Flex";
            } else {
              btn.className = "w-full h-8 rounded border transition-all text-[11px] font-semibold bg-emerald-500/20 border-emerald-400/60 text-emerald-300 select-none";
              btn.innerText = "⚔️ Available";
            }
            return;
          }

          // ---------------------------------------------------------------
          // SUMMARY VIEW: COMBINED RESULTS MODE (VIEW ONLY)
          // ---------------------------------------------------------------
          btn.style.cursor = 'default';

          // 1. BOTH BUSY
          if (francisState === 'busy' && lyujiState === 'busy') {
            btn.className = "w-full h-8 rounded border transition-all text-[11px] font-medium bg-red-500/15 border-red-500/30 text-red-400/80 select-none";
            btn.innerText = "🚫 Busy";
          }
          // 2. ONE IS BUSY (BUSY OVERRIDES FLEX & FREE)
          else if (francisState === 'busy' || lyujiState === 'busy') {
            if (francisState === 'busy') {
              btn.className = "w-full h-8 rounded border transition-all text-[11px] font-medium bg-purple-500/20 border-purple-400/60 text-purple-300 select-none";
              btn.innerText = "Lyuji Only";
            } else {
              btn.className = "w-full h-8 rounded border transition-all text-[11px] font-medium bg-cyan-500/20 border-cyan-400/60 text-cyan-300 select-none";
              btn.innerText = "Francis Only";
            }
          }
          // 3. BOTH ARE FLEX (NEGOTIABLE)
          else if (francisState === 'negotiable' && lyujiState === 'negotiable') {
            btn.className = "w-full h-8 rounded border transition-all text-[11px] font-medium bg-amber-500/25 border-amber-400/80 text-amber-300 select-none shadow-[0_0_8px_rgba(245,158,11,0.15)]";
            btn.innerText = "🌙 Both (Flex)";
          }
          // 4. ONE IS FLEX, ONE IS FREE (MATCH)
          else if (francisState === 'negotiable' || lyujiState === 'negotiable') {
            const who = francisState === 'negotiable' ? 'Francis' : 'Lyuji';
            btn.className = "w-full h-8 rounded border transition-all text-[11px] font-medium bg-amber-500/20 border-amber-400/60 text-amber-300 select-none";
            btn.innerText = `🌙 ${who} (Flex)`;
          }
          // 5. BOTH FREE -> DEFAULT MATCH
          else {
            btn.className = "w-full h-8 rounded border transition-all text-[11px] font-bold bg-emerald-500/20 border-emerald-400/80 text-emerald-300 shadow-[0_0_10px_rgba(16,185,129,0.15)] select-none";
            btn.innerText = "⚔️ MATCH";
          }
        });
      }
      updateUndoRedoUI();
    }

    // ------------------------------------------------------------------
    // Mouse Dragging & State Cycle
    // ------------------------------------------------------------------
    function handleMouseDown(e, slotKey) {
      if (e.button !== 0 || currentUser === 'Summary') return; // View-only mode for Summary
      isMouseDown = true;
      currentDragChanges = {};

      const weekData = getCurrentWeekData();
      const userKey = currentUser.toLowerCase();
      const current = weekData[slotKey] || { francis: 'free', lyuji: 'free' };
      
      // Cycle: Available (free) -> BUSY (busy) -> FLEX (negotiable)
      const stateCycle = ['free', 'busy', 'negotiable'];
      const currentState = normalizeState(current[userKey]);
      const nextIdx = (stateCycle.indexOf(currentState) + 1) % stateCycle.length;
      
      targetDragState = stateCycle[nextIdx];

      applyStateToSlot(slotKey, targetDragState);
    }

    function handleMouseEnter(slotKey) {
      if (!isMouseDown || currentUser === 'Summary') return;
      applyStateToSlot(slotKey, targetDragState);
    }

    function applyStateToSlot(slotKey, nextState) {
      const weekData = getCurrentWeekData();
      const userKey = currentUser.toLowerCase();
      const current = weekData[slotKey] || { francis: 'free', lyuji: 'free' };
      const prevState = normalizeState(current[userKey]);

      if (prevState === nextState) return;

      if (!currentDragChanges[slotKey]) {
        currentDragChanges[slotKey] = {
          user: userKey,
          prev: prevState,
          next: nextState
        };
      } else {
        currentDragChanges[slotKey].next = nextState;
      }

      weekData[slotKey] = {
        ...current,
        [userKey]: nextState
      };

      renderGrid();
    }

    async function handleMouseUp() {
      if (!isMouseDown || currentUser === 'Summary') return;
      isMouseDown = false;

      const changedKeys = Object.keys(currentDragChanges);
      if (changedKeys.length === 0) return;

      const undoStack = getWeekUndoStack();
      const redoStack = getWeekRedoStack();

      undoStack.push({ ...currentDragChanges });
      redoStack.length = 0; 

      syncBatchToSupabase(changedKeys);
      updateUndoRedoUI();
    }

    // ------------------------------------------------------------------
    // Per-Week Undo / Redo Logic
    // ------------------------------------------------------------------
    function handleKeyDown(e) {
      if (currentUser === 'Summary') return;

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        if (e.shiftKey) {
          redo();
        } else {
          undo();
        }
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
        redo();
      }
    }

    function undo() {
      if (currentUser === 'Summary') return;

      const undoStack = getWeekUndoStack();
      const redoStack = getWeekRedoStack();

      if (undoStack.length === 0) return;

      const lastAction = undoStack.pop();
      redoStack.push(lastAction);

      const weekData = getCurrentWeekData();
      const keysToSync = [];
      Object.entries(lastAction).forEach(([slotKey, change]) => {
        const current = weekData[slotKey] || { francis: 'free', lyuji: 'free' };
        weekData[slotKey] = {
          ...current,
          [change.user]: change.prev
        };
        keysToSync.push(slotKey);
      });

      renderGrid();
      syncBatchToSupabase(keysToSync);
    }

    function redo() {
      if (currentUser === 'Summary') return;

      const undoStack = getWeekUndoStack();
      const redoStack = getWeekRedoStack();

      if (redoStack.length === 0) return;

      const actionToRedo = redoStack.pop();
      undoStack.push(actionToRedo);

      const weekData = getCurrentWeekData();
      const keysToSync = [];
      Object.entries(actionToRedo).forEach(([slotKey, change]) => {
        const current = weekData[slotKey] || { francis: 'free', lyuji: 'free' };
        weekData[slotKey] = {
          ...current,
          [change.user]: change.next
        };
        keysToSync.push(slotKey);
      });

      renderGrid();
      syncBatchToSupabase(keysToSync);
    }

    function updateUndoRedoUI() {
      const btnUndo = document.getElementById('btn-undo');
      const btnRedo = document.getElementById('btn-redo');

      const undoStack = getWeekUndoStack();
      const redoStack = getWeekRedoStack();

      if (btnUndo) btnUndo.disabled = undoStack.length === 0;
      if (btnRedo) btnRedo.disabled = redoStack.length === 0;
    }

    // ------------------------------------------------------------------
    // Supabase Load & Sync
    // ------------------------------------------------------------------
    async function syncBatchToSupabase(keys) {
      if (!supabaseClient || keys.length === 0) return;
      const weekData = getCurrentWeekData();

      const payloadBatch = keys.map(key => ({
        id: key,
        francis: weekData[key].francis,
        lyuji: weekData[key].lyuji
      }));

      const { error } = await supabaseClient
        .from('schedule')
        .upsert(payloadBatch, { onConflict: 'id' });

      if (error) {
        console.error("Error batch saving to Supabase:", error);
      }
    }

    async function loadScheduleForCurrentWeek() {
      const weekData = getCurrentWeekData();

      if (!supabaseClient) {
        renderGrid();
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from('schedule')
          .select('*')
          .like('id', `${currentWeek}_%`);

        if (error) return console.error('Fetch error:', error);

        if (data) {
          data.forEach(row => {
            weekData[row.id] = {
              francis: normalizeState(row.francis),
              lyuji: normalizeState(row.lyuji)
            };
          });
        }
        renderGrid();
      } catch (e) {
        console.error("Supabase load error:", e);
      }
    }

    function subscribeToChanges() {
      if (!supabaseClient) return;

      supabaseClient
        .channel('public:schedule')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'schedule' }, payload => {
          if (payload.new && payload.new.id) {
            const slotKey = payload.new.id;
            const weekPrefix = slotKey.split('_')[0];
            
            if (!scheduleByWeek[weekPrefix]) {
              scheduleByWeek[weekPrefix] = {};
            }

            scheduleByWeek[weekPrefix][slotKey] = {
              francis: normalizeState(payload.new.francis),
              lyuji: normalizeState(payload.new.lyuji)
            };

            if (weekPrefix === currentWeek) {
              renderGrid();
            }
          }
        })
        .subscribe();
    }

    async function clearWeek() {
      if (!confirm(`Reset all slots to default for page week ${currentWeek}?`)) return;

      scheduleByWeek[currentWeek] = {};
      undoStacksByWeek[currentWeek] = [];
      redoStacksByWeek[currentWeek] = [];

      renderGrid();

      if (supabaseClient) {
        const { error } = await supabaseClient
          .from('schedule')
          .delete()
          .like('id', `${currentWeek}_%`);

        if (error) console.error("Error clearing week:", error);
      }
    }
  </script>
</body>
